name: Build RME with CipSoft .sec support

# The .sec format test runs first and gates the Windows build, so a binary
# is only ever produced from a tree whose map round-trip is proven lossless.

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  sec-format-test:
    name: .sec round-trip test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the format test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
              -o test_sec_roundtrip \
              source/sec_format.cpp source/test_sec_roundtrip.cpp

      - name: Round-trip the fixtures
        run: |
          ./test_sec_roundtrip test/sec_fixtures

      - name: Build the monster data tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
              -o test_mon_roundtrip \
              source/sec_mon.cpp source/test_mon_roundtrip.cpp
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
              -o test_monsterdb_roundtrip \
              source/sec_monsterdb.cpp source/sec_mon.cpp source/test_monsterdb_roundtrip.cpp

      # Point MON_DIR / MONSTER_DB at a real server tree to gate on the live
      # 448 races and 22k spawn rows instead of the fixtures.
      - name: Round-trip the monster data (optional)
        if: ${{ env.MON_DIR != '' }}
        run: |
          ./test_mon_roundtrip "$MON_DIR"
          ./test_monsterdb_roundtrip "$MONSTER_DB" "$MON_DIR"

      # Point SEC_MAP_DIR at a real map checkout to test against the full
      # 9873-sector map instead of the small fixture set.
      - name: Round-trip a full map (optional)
        if: ${{ env.SEC_MAP_DIR != '' }}
        run: |
          ./test_sec_roundtrip "$SEC_MAP_DIR"

  build-windows:
    name: Windows build
    needs: sec-format-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
          key: vcpkg-${{ runner.os }}-wx-boost-v1

      - name: Install dependencies
        id: deps
        shell: pwsh
        run: |
          vcpkg install `
            wxwidgets:x64-windows `
            boost-date-time:x64-windows `
            boost-system:x64-windows `
            boost-filesystem:x64-windows `
            boost-iostreams:x64-windows `
            asio:x64-windows `
            fmt:x64-windows `
            nlohmann-json:x64-windows `
            zlib:x64-windows `
            freeglut:x64-windows

      # Save even when a later step fails - otherwise a failed compile
      # rebuilds wxWidgets from source on the next run, about an hour.
      - name: Save vcpkg cache
        if: always() && steps.deps.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
          key: vcpkg-${{ runner.os }}-wx-boost-v1

      # vcpkg's exported configs (fmt, nlohmann_json) contain
      # cmake_policy(VERSION <3.5) calls that CMake 4 rejects. They are
      # generated third-party files, so they cannot be patched here.
      # The env var form is documented since CMake 4.0 and, unlike -D,
      # involves no PowerShell argument parsing.
      - name: Configure
        shell: pwsh
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cmake -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config RelWithDebInfo --parallel 2>&1 |
            Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      # Job logs need repo-admin auth to download via the API, which blocks
      # reading them from outside. Push the compile log to an orphan branch
      # instead: raw.githubusercontent.com serves it with no auth at all.
      - name: Publish build log
        if: always()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          rm -rf /tmp/logrepo
          if git clone --depth 1 --branch ci-logs "$url" /tmp/logrepo 2>/dev/null; then
            :
          else
            git clone --depth 1 "$url" /tmp/logrepo
            git -C /tmp/logrepo checkout --orphan ci-logs
            git -C /tmp/logrepo rm -rf . >/dev/null 2>&1 || true
          fi
          cp build.log "/tmp/logrepo/build-${{ github.run_id }}.log"
          cp build.log /tmp/logrepo/latest.log
          git -C /tmp/logrepo config user.email actions@github.com
          git -C /tmp/logrepo config user.name "GitHub Actions"
          git -C /tmp/logrepo add -A
          git -C /tmp/logrepo commit -m "build log for run ${{ github.run_id }}"
          git -C /tmp/logrepo push origin ci-logs

      # The x64-windows triplet links wxWidgets, fmt, zlib and freeglut as
      # DLLs, so shipping rme.exe alone gives "wxmsw331u_aui_vc_x64_custom.dll
      # was not found" on any machine without vcpkg. Ship the runtime beside
      # it: whatever VCPKG_APPLOCAL_DEPS dropped next to the exe, plus the
      # release DLLs from the vcpkg tree as a backstop.
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Recurse -Path build -Filter rme.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "rme.exe not found under build/" }
          Copy-Item $exe.FullName -Destination dist
          Copy-Item (Join-Path $exe.DirectoryName '*.dll') -Destination dist `
                    -ErrorAction SilentlyContinue
          Copy-Item 'C:/vcpkg/installed/x64-windows/bin/*.dll' -Destination dist `
                    -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force data dist/data
          $dlls = @(Get-ChildItem dist -Filter *.dll)
          Write-Host "collected $($dlls.Count) DLLs"
          if ($dlls.Count -eq 0) { throw "no DLLs collected - rme.exe will not start" }
          $dlls.Name | Sort-Object | ForEach-Object { Write-Host "  $_" }
          # Record exactly what went into the binary.
          "commit: ${{ github.sha }}"          | Out-File dist/BUILD_INFO.txt -Encoding utf8
          "workflow run: ${{ github.run_id }}" | Out-File dist/BUILD_INFO.txt -Append -Encoding utf8
          Get-FileHash dist/rme.exe -Algorithm SHA256 |
            Format-List | Out-File dist/BUILD_INFO.txt -Append -Encoding utf8

      - name: Show binary hash
        shell: pwsh
        run: Get-Content dist/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rme-sec-windows-x64
          path: dist
